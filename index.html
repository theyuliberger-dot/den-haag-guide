<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FA">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המדריך">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>המדריך לברגרים בהאג</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
  :root{
    --bg:#F4F6FA; --card:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E9EDF3; --navy:#0F172A;
    --blue-bg:#E0F2FE; --blue:#0284C7; --lime-bg:#ECFCCB; --lime:#4D7C0F;
    --orange-bg:#FFEDD5; --orange:#EA580C; --violet-bg:#EDE9FE; --violet:#7C3AED;
    --pink-bg:#FCE7F3; --pink:#DB2777; --teal-bg:#CCFBF1; --teal:#0F766E;
    --amber-bg:#FEF3C7; --amber:#B45309; --sky-bg:#E0E7FF; --sky:#4338CA;
    --shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  a{color:inherit}
  .app{display:flex;min-height:100vh;gap:24px;padding:20px}

  .side{width:270px;flex-shrink:0;background:var(--card);border-radius:24px;box-shadow:var(--shadow);
        display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:20px;height:calc(100vh - 40px)}
  .brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;border-bottom:1px solid var(--line);text-decoration:none}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;flex-shrink:0}
  .brand b{font-size:16px;font-weight:700;line-height:1.25}
  .nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1;margin:4px -4px 10px;padding:0 4px}
  .nav .sec{font-size:12px;font-weight:600;color:#94A3B8;letter-spacing:.04em;margin:16px 12px 6px}
  .nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;color:#334155;text-decoration:none;font-size:15px;font-weight:500}
  .nav a:hover{background:#F1F5F9}
  .nav a.on{background:var(--navy);color:#fff}
  .nav a .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
  .nav a.on .ic{background:rgba(255,255,255,.12)!important;color:#fff!important}
  .nav svg{width:18px;height:18px}
  .count{margin-inline-start:auto;background:var(--pink-bg);color:var(--pink);font-size:12px;border-radius:999px;padding:1px 8px}
  .nav a.on .count{background:rgba(255,255,255,.18);color:#fff}
  .fam{display:flex;align-items:center;gap:10px;background:#F8FAFC;border-radius:18px;padding:12px}
  .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#A855F7);color:#fff;display:grid;place-items:center;font-weight:600}
  .fam small{display:block;color:var(--muted);font-size:12px}

  main{flex:1;min-width:0;padding:16px 8px 40px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  h1{font-size:30px;font-weight:700;margin:0 0 6px}
  .sub{color:var(--muted);margin:0;font-size:16px}
  .btns{display:flex;gap:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;font:500 15px Rubik,sans-serif;text-decoration:none;
       border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
  .btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
  .btn svg{width:18px;height:18px}
  .burger{display:none}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px;margin-bottom:22px}
  .card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:22px}
  .stat{display:flex;gap:14px;align-items:flex-start}
  .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
  .tile svg{width:24px;height:24px}
  .tile.sm{width:40px;height:40px;border-radius:12px}
  .tile.sm svg{width:20px;height:20px}
  .lbl{font-size:13px;color:var(--muted);font-weight:500;margin:2px 0 4px}
  .val{font-size:26px;font-weight:700;margin:0;line-height:1.15}
  .ltr{direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-size:.85em}
  .note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.55}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
  .card h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:600;margin:0 0 12px}
  .card h2 svg{width:22px;height:22px;color:var(--muted)}
  .card h3{font-size:17px;margin:0 0 2px}
  .month{margin-bottom:16px}
  .row{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line);text-decoration:none}
  .card h2 + .row, .chips + .row{border-top:0}
  .row.link:hover .t{text-decoration:underline}
  .dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
  .dot svg{width:18px;height:18px}
  .row .t{font-weight:500;margin:0}
  .row .s{font-size:13px;color:var(--muted);margin:2px 0 0}
  .row .s svg{width:13px;height:13px;vertical-align:-2px}
  .row .when{margin-inline-start:auto;font-size:13px;color:var(--muted);white-space:nowrap}
  .tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;margin-top:6px}
  .more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:500;color:var(--blue);text-decoration:none}
  .more svg{width:16px;height:16px}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font:500 14px Rubik,sans-serif;color:#334155;cursor:pointer}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .sec-h{margin:8px 0 14px}
  .pill{font-size:15px;font-weight:600;padding:6px 14px;border-radius:999px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-bottom:24px}
  .pcard{background:var(--card);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .photo{height:160px;flex-shrink:0;overflow:hidden;background:#EEF2F7;display:grid;place-items:center;color:#94A3B8}
  .photo svg{width:36px;height:36px}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .pbody{padding:16px 18px 14px;display:flex;flex-direction:column;flex:1}
  .pbody p{font-size:14px;color:#475569;line-height:1.6;margin:8px 0 12px;flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .meta span{font-size:12px;background:#F1F5F9;color:#334155;border-radius:999px;padding:3px 10px}
  .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:7px 12px;border-radius:12px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:#fff}
  .mini svg{width:15px;height:15px}
  .heart{margin-inline-start:auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#94A3B8}
  .heart svg{width:18px;height:18px}
  .heart.on{background:var(--pink-bg);border-color:var(--pink-bg);color:var(--pink)}
  .heart.on svg{fill:var(--pink)}
  .custom h3{margin-top:2px}
  .mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
  .minfo{display:flex;gap:12px}
  .minfo .t{font-weight:600;margin:0}
  .minfo .s{font-size:13px;color:var(--muted);margin:4px 0 0;line-height:1.55}
  .list{margin:0;padding-inline-start:20px;line-height:1.7;font-size:14px;color:#334155}
  .list li{margin-bottom:6px}
  .check{cursor:pointer;align-items:flex-start}
  .check input{width:22px;height:22px;margin:4px 0 0;accent-color:var(--navy);flex-shrink:0}
  .check.done .t{text-decoration:line-through;color:var(--muted)}
  .src{font-size:12px;color:var(--muted);margin:16px 4px}
  .card h2 .tile.sm{margin:0}
  .empty{text-align:center;color:var(--muted)}
  .empty svg{width:32px;height:32px;color:var(--pink)}

  .scrim{display:none}
  @media (max-width:860px){
    body{overflow-x:hidden}
    .app{padding:12px;gap:0}
    .side{position:fixed;top:12px;bottom:12px;inset-inline-start:12px;z-index:20;height:auto;max-width:calc(100vw - 48px);
          visibility:hidden;opacity:0;transform:scale(.97);transition:opacity .2s,transform .2s,visibility .2s}
    .side.open{visibility:visible;opacity:1;transform:none}
    .scrim.open{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:10}
    .burger{display:inline-flex}
    h1{font-size:24px}
    main{padding:8px 4px 40px}
    .btns .btn span{display:none}
    .btn{padding:10px 13px}
    .grid2{grid-template-columns:minmax(0,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#home">
      <div class="logo"><i data-lucide="map-pinned"></i></div>
      <b id="brandName"></b>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="fam">
      <div class="av">B</div>
      <div><b id="famName"></b><small id="famCity"></small></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
